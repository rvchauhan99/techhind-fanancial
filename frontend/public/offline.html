<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F284E" />
    <title>Offline — TechHind Finance</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b192c;
        color: #e2e8f0;
        font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 24px;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #94a3b8; font-size: 0.875rem; line-height: 1.45; }
      button {
        background: #0066cc;
        color: white;
        border: 0;
        border-radius: 8px;
        min-height: 44px;
        padding: 0 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>TechHind Finance needs a connection for invoices, GST, and payments. Cached screens stay on this device. Nothing is saved offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
