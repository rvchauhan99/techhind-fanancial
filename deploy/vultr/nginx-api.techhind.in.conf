# OPTIONAL — not used on the current Vultr host.
# Ports 80/443 are owned by Docker (Caddy + other stacks).
# Prefer deploy/vultr/caddy-api.techhind.in.conf appended to
# /opt/calling-crm/deploy/Caddyfile instead.

server {
    listen 80;
    listen [::]:80;
    server_name api.techhind.in;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
