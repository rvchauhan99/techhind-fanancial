# TechHind Finance API — site block for shared Caddy (calling-crm stack on Vultr).
# Appended into /opt/calling-crm/deploy/Caddyfile by deploy.sh.
# Upstream: uvicorn on host 127.0.0.1:8010 (port 8000 is used by calling-crm).

api.techhind.in {
	encode gzip
	reverse_proxy host.docker.internal:8010
}
